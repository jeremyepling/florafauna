name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Generate Minecraft data
        run: ./gradlew runData --no-daemon --stacktrace
        env:
          # Apply JVM args (adjusted for CI memory limits)
          GRADLE_OPTS: -Xmx4G -Xms2G -XX:+UseG1GC -XX:MaxMetaspaceSize=1G

      - name: Build the mod and run GameTests
        run: ./gradlew build runGameTestServer --no-daemon --stacktrace
        env:
          GRADLE_OPTS: -Xmx4G -Xms2G -XX:+UseG1GC -XX:MaxMetaspaceSize=1G

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: florafauna-mod
          path: build/libs/*.jar
          retention-days: 14
