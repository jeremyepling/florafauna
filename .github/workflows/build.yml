name: Build

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main, '[0-9]*']
    tags: ['**']
  workflow_dispatch:

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI_GRADLE_JVMARGS: -Xms256m -Xmx4g -XX:MaxMetaspaceSize=1g
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Generate Minecraft data
        if: github.event.pull_request.draft != true
        run: ./gradlew runData --no-daemon --max-workers=2 --stacktrace "-Dorg.gradle.jvmargs=$CI_GRADLE_JVMARGS"

      - name: Compile and run unit tests for a draft
        if: github.event.pull_request.draft == true
        run: ./gradlew check --no-daemon --max-workers=2 --stacktrace "-Dorg.gradle.jvmargs=$CI_GRADLE_JVMARGS"

      - name: Build the mod and run GameTests
        if: github.event.pull_request.draft != true
        run: ./gradlew build runGameTestServer --no-daemon --max-workers=2 --stacktrace "-Dorg.gradle.jvmargs=$CI_GRADLE_JVMARGS"

      - name: Upload build artifacts
        if: github.event.pull_request.draft != true
        uses: actions/upload-artifact@v4
        with:
          name: florafauna-mod
          path: build/libs/*.jar
          retention-days: 14
