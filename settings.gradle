pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.kikugie.dev/releases' }
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'dev.kikugie.stonecutter' version '0.9.8'
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'florafauna'

def previewTarget = '26.4-neoforge'
def previewEnabled = providers.gradleProperty('previewNeoVersion').isPresent()
def available = file('versions').listFiles().findAll {
    new File(it, 'gradle.properties').isFile() && (it.name != previewTarget || previewEnabled)
}*.name.sort()

if (!previewEnabled && gradle.startParameter.taskNames.any { it.tokenize(':').contains(previewTarget) }) {
    throw new GradleException('The 26.4 preview requires -PpreviewNeoVersion=<NeoForge version for 26.4-snapshot-10>.')
}

stonecutter {
    centralScript = 'build.gradle'
    create(rootProject) {
        available.each { version(it, it.take(it.lastIndexOf('-'))) }
        vcsVersion = '26.1-neoforge'
    }
}

// Per-worktree local build cache to prevent cross-tree cache interactions
buildCache {
    local {
        enabled = true
        directory = new File(rootDir, ".gradle-build-cache")
    }
}

def companions = ['hammer', 'frenchies']
def requested = providers.gradleProperty('devMods').orElse('none').get().trim()
def selected = requested == 'all' ? companions : requested == 'none' ? [] : requested.split(',', -1)*.trim()
def unknown = selected - companions
if (unknown || selected.size() != selected.unique(false).size()) {
    throw new GradleException("Use -PdevMods=all, none, hammer, frenchies, or hammer,frenchies (got '${requested}').")
}

// Qualified Stonecutter tasks only need checkouts for their own Minecraft version.
def requestedProjects = gradle.startParameter.taskNames.collectMany { it.tokenize(':') }.intersect(available)
def targets = (requestedProjects ?: available).unique().collect { it.take(it.lastIndexOf('-')) }
// A grouped workspace uses <mod>/main and <mod>/worktrees/<feature>.
def modHome = rootDir.parentFile.name == 'worktrees' ? rootDir.parentFile.parentFile : rootDir.parentFile
def builds = [:]
targets.each { target ->
    def game = new Properties()
    file("versions/${target}-neoforge/gradle.properties").withReader('UTF-8') { game.load(it) }
    def mcVersion = game.minecraft_version
    selected.each { companion ->
        def checkoutNames = ["${companion}-${mcVersion}", "florafauna-${companion}-${mcVersion}",
                             companion, "florafauna-${companion}"]
        def candidates = []
        if (modHome.name == 'florafauna') {
            def versionDir = target == '26.1' ? 'main' : target
            def main = new File(modHome.parentFile, "${companion}/main")
            if (new File(main, "versions/${target}-neoforge/gradle.properties").isFile()) candidates << main
            candidates << new File(modHome.parentFile, "${companion}/${versionDir}")
        }
        candidates.addAll(checkoutNames.collect { file("../${it}") })
        def sibling = candidates.find { it.isDirectory() } ?: file("../${companion}")
        def dir = file(providers.gradleProperty("${companion}Dir").orElse(sibling.path).get())
        def metadata = new File(dir, 'gradle.properties')
        if (!metadata.isFile()) {
            throw new GradleException("Missing ${companion} checkout at ${dir}. Clone the sibling repository or pass -P${companion}Dir=<checkout>.")
        }
        def props = new Properties()
        metadata.withReader('UTF-8') { props.load(it) }
        def targetProject = ":${target}-neoforge"
        def targetMetadata = new File(dir, "versions/${target}-neoforge/gradle.properties")
        if (targetMetadata.isFile()) {
            targetMetadata.withReader('UTF-8') { props.load(it) }
        }
        if (props.mod_id != "florafauna_${companion}" || props.minecraft_version != mcVersion) {
            throw new GradleException("Expected florafauna_${companion} for Minecraft ${mcVersion} at ${dir}, found ${props.mod_id} for ${props.minecraft_version}.")
        }
        def build = builds.computeIfAbsent(dir.canonicalFile) {
            [name: targetMetadata.isFile() ? "dev-${companion}" : "dev-${companion}-${mcVersion}", modules: [:]]
        }
        build.modules["net.j40climb.dev:${companion}-${mcVersion}"] = targetMetadata.isFile() ? targetProject : ':'
    }
}
builds.each { dir, build ->
    includeBuild(dir) {
        name = build.name
        dependencySubstitution {
            build.modules.each { coordinate, path -> substitute(module(coordinate)).using(project(path)) }
        }
    }
}
